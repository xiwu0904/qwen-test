<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .info-message {
            background: #e3f2fd;
            color: #1976d2;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-size: 0.9em;
        }

        .info-message.active {
            display: block;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .preview-container {
            margin-top: 20px;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        select:focus, input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-container {
            margin-top: 30px;
            display: none;
        }

        .result-container.active {
            display: block;
        }

        .result-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .result-videos {
            margin-top: 20px;
        }

        .result-video {
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            margin: 0 auto;
            display: block;
        }

        .result-image-wrapper {
            position: relative;
        }

        .result-image {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .image-index {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI Image Generation</h1>
        
        <form id="imageForm">
            <div class="form-group">
                <label>Upload Reference Image</label>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <p>Click to upload or drag and drop image here</p>
                    <input type="file" id="fileInput" accept="image/*" required>
                </div>
                <div class="preview-container" id="previewContainer" style="display: none;">
                    <img id="previewImage" class="preview-image" alt="Preview">
                    <div class="info-message" id="dimensionInfo"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="modelSelect">Select Model</label>
                <select id="modelSelect" required>
                    <option value="">-- Select a model --</option>
                    <option value="qwen-image">Qwen Image Edit Plus (qwen-image-edit-plus-2025-10-30)</option>
                    <option value="wanx">Wanxiang 2.5 Image Edit (wan2.5-i2i-preview)</option>
                    <option value="i2v">Wanxiang 2.5 Image-to-Video (wan2.5-i2v-preview)</option>
                </select>
                <small id="modelInfo" style="display: block; margin-top: 8px; color: #666; font-size: 0.9em;"></small>
            </div>

            <div class="form-group">
                <label for="promptInput">Prompt (Description for the image to generate)</label>
                <textarea id="promptInput" placeholder="Enter your prompt here, e.g., 'A beautiful sunset over the mountains in the same style'" required></textarea>
            </div>

            <div class="form-group">
                <label for="negativePromptInput">Negative Prompt (Optional - What to avoid in the image)</label>
                <textarea id="negativePromptInput" placeholder="e.g., low quality, blurry, distorted, bad proportions, extra fingers"></textarea>
            </div>

            <div class="form-group">
                <label for="numImages">Number of Images to Generate</label>
                <select id="numImages">
                    <option value="1" selected>1 image</option>
                    <option value="2">2 images</option>
                    <option value="3">3 images</option>
                    <option value="4">4 images</option>
                    <option value="5">5 images</option>
                    <option value="6">6 images</option>
                </select>
            </div>

            <div class="form-group" id="i2vOptions" style="display: none;">
                <label for="resolution">Video Resolution</label>
                <select id="resolution">
                    <option value="480P">480P</option>
                    <option value="720P" selected>720P</option>
                    <option value="1080P">1080P</option>
                </select>
            </div>

            <div class="form-group" id="durationGroup" style="display: none;">
                <label for="duration">Video Duration (seconds)</label>
                <select id="duration">
                    <option value="5" selected>5 seconds</option>
                    <option value="10">10 seconds</option>
                </select>
            </div>

            <div class="form-group" id="audioGroup" style="display: none;">
                <label>
                    <input type="checkbox" id="enableAudio" checked>
                    Enable Auto Audio Generation
                    <small style="display: block; margin-left: 24px; color: #666; font-size: 0.85em; margin-top: 4px;">
                        Automatically generate synchronized audio for the video
                    </small>
                </label>
            </div>

            <div class="form-group">
                <label for="seedInput">Seed (Optional - For reproducible results)</label>
                <input type="number" id="seedInput" min="0" max="2147483647" placeholder="Leave empty for random (0-2147483647)">
                <small style="display: block; margin-top: 8px; color: #1565c0; font-size: 0.85em;">
                    💡 For consistent results: Use same seed + same prompt + disable prompt optimization + same image + same negative prompt
                </small>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="promptExtend" checked>
                    Enable Intelligent Prompt Optimization
                    <small style="display: block; margin-left: 24px; color: #e65100; font-size: 0.85em; margin-top: 4px;">
                        ⚠️ Disable this for reproducible results with same seed. When enabled, prompts are rewritten by AI, causing variations even with same seed.
                    </small>
                </label>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="watermark">
                    Add Qwen-Image Watermark
                </label>
            </div>

            <button type="submit" class="btn">Generate Image</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p id="loadingText" style="margin-top: 15px; color: #667eea; font-weight: 600;">Generating image...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-container" id="resultContainer">
            <h2 style="margin-bottom: 20px; color: #333;">Generated Result</h2>
            <div class="result-images" id="resultImages"></div>
            <div class="result-videos" id="resultVideos" style="display: none;"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const imageForm = document.getElementById('imageForm');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('resultContainer');
        const resultImages = document.getElementById('resultImages');
        const resultVideos = document.getElementById('resultVideos');
        const errorMessage = document.getElementById('errorMessage');
        const modelSelect = document.getElementById('modelSelect');
        const modelInfo = document.getElementById('modelInfo');
        const dimensionInfo = document.getElementById('dimensionInfo');
        const loadingText = document.getElementById('loadingText');

        // Model information
        const modelDescriptions = {
            'qwen-image': 'Qwen model - Single/multi-image editing with synchronous API (instant results)',
            'wanx': 'Wanxiang model - Advanced multi-image fusion with asynchronous API (1-2 minutes, supports up to 2 reference images)',
            'i2v': 'Wanxiang Image-to-Video - Generate 5-10 second videos from images with optional audio (1-5 minutes processing)'
        };

        // Show/hide video-specific options
        modelSelect.addEventListener('change', (e) => {
            const selected = e.target.value;
            const isI2V = selected === 'i2v';
            
            // Toggle video options visibility
            document.getElementById('i2vOptions').style.display = isI2V ? 'block' : 'none';
            document.getElementById('durationGroup').style.display = isI2V ? 'block' : 'none';
            document.getElementById('audioGroup').style.display = isI2V ? 'block' : 'none';
            
            // Toggle image count options (hide for i2v)
            document.getElementById('numImages').parentElement.style.display = isI2V ? 'none' : 'block';
            
            if (selected && modelDescriptions[selected]) {
                modelInfo.textContent = modelDescriptions[selected];
                modelInfo.style.display = 'block';
            } else {
                modelInfo.style.display = 'none';
            }
        });

        // Handle click on upload area
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle file selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Handle drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                fileInput.files = e.dataTransfer.files;
                handleFile(file);
            }
        });

        // Preview uploaded image
        function handleFile(file) {
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewContainer.style.display = 'block';
                    
                    // Check image dimensions
                    const img = new Image();
                    img.onload = function() {
                        const width = this.width;
                        const height = this.height;
                        const minDim = 384;
                        
                        if (width < minDim || height < minDim) {
                            dimensionInfo.textContent = `⚠️ Image is ${width}x${height}px. It will be automatically padded to meet minimum ${minDim}x${minDim}px requirement (no distortion).`;
                            dimensionInfo.className = 'info-message active';
                        } else {
                            dimensionInfo.textContent = `✓ Image dimensions: ${width}x${height}px (meets requirements)`;
                            dimensionInfo.className = 'info-message active';
                            dimensionInfo.style.background = '#e8f5e9';
                            dimensionInfo.style.color = '#2e7d32';
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Handle form submission
        imageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            formData.append('model', document.getElementById('modelSelect').value);
            formData.append('prompt', document.getElementById('promptInput').value);
            formData.append('negative_prompt', document.getElementById('negativePromptInput').value);
            formData.append('n', document.getElementById('numImages').value);
            formData.append('prompt_extend', document.getElementById('promptExtend').checked);
            formData.append('watermark', document.getElementById('watermark').checked);
            
            // Add video-specific parameters if i2v model is selected
            const selectedModel = document.getElementById('modelSelect').value;
            if (selectedModel === 'i2v') {
                formData.append('resolution', document.getElementById('resolution').value);
                formData.append('duration', document.getElementById('duration').value);
                formData.append('audio', document.getElementById('enableAudio').checked);
            }
            
            const seedValue = document.getElementById('seedInput').value;
            if (seedValue) {
                formData.append('seed', seedValue);
            }

            // Hide previous results and errors
            resultContainer.classList.remove('active');
            errorMessage.classList.remove('active');
            loading.classList.add('active');
            
            // Update loading message based on model
            if (selectedModel === 'wanx') {
                loadingText.textContent = 'Creating async task... (This may take 1-2 minutes for Wanxiang model)';
            } else if (selectedModel === 'i2v') {
                loadingText.textContent = 'Creating video generation task... (This may take 1-5 minutes)';
            } else {
                loadingText.textContent = 'Generating image...';
            }

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // Check if result is video or images
                    if (data.video_url) {
                        // Display video
                        resultImages.style.display = 'none';
                        resultVideos.style.display = 'block';
                        resultVideos.innerHTML = '';
                        
                        const video = document.createElement('video');
                        video.src = data.video_url;
                        video.className = 'result-video';
                        video.controls = true;
                        video.autoplay = false;
                        
                        resultVideos.appendChild(video);
                        
                        // Show model and version info
                        if (data.model_version) {
                            const infoDiv = document.createElement('div');
                            infoDiv.style.cssText = 'margin-top: 15px; padding: 10px; background: #f0f2ff; border-radius: 8px; color: #667eea; font-size: 0.9em; text-align: center;';
                            let infoText = `<strong>Model:</strong> ${data.model_version}`;
                            if (data.resolution) infoText += ` | <strong>Resolution:</strong> ${data.resolution}`;
                            if (data.duration) infoText += ` | <strong>Duration:</strong> ${data.duration}s`;
                            if (data.audio_enabled) infoText += ` | <strong>Audio:</strong> Enabled`;
                            infoDiv.innerHTML = infoText;
                            resultVideos.appendChild(infoDiv);
                        }
                        
                        resultContainer.classList.add('active');
                    } else if (data.images && data.images.length > 0) {
                        // Display images
                        resultVideos.style.display = 'none';
                        resultImages.style.display = 'grid';
                        resultImages.innerHTML = '';
                    
                        // Display all generated images
                        data.images.forEach((imageUrl, index) => {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'result-image-wrapper';
                            
                            const img = document.createElement('img');
                            img.src = imageUrl;
                            img.className = 'result-image';
                            img.alt = `Generated Image ${index + 1}`;
                            
                            if (data.images.length > 1) {
                                const indexLabel = document.createElement('div');
                                indexLabel.className = 'image-index';
                                indexLabel.textContent = `Image ${index + 1}`;
                                wrapper.appendChild(indexLabel);
                            }
                            
                            wrapper.appendChild(img);
                            resultImages.appendChild(wrapper);
                        });
                        
                        // Show model and version info
                        if (data.model_version) {
                            const infoDiv = document.createElement('div');
                            infoDiv.style.cssText = 'margin-top: 15px; padding: 10px; background: #f0f2ff; border-radius: 8px; color: #667eea; font-size: 0.9em;';
                            let infoText = `<strong>Model:</strong> ${data.model_version} | <strong>Images:</strong> ${data.count}${data.seed ? ` | <strong>Seed:</strong> ${data.seed}` : ''}`;
                            
                            if (data.padded) {
                                infoText += ` | <span style="color: #1976d2;">ℹ️ Image was automatically padded to meet minimum dimension requirements</span>`;
                            }
                            
                            infoDiv.innerHTML = infoText;
                            resultImages.appendChild(infoDiv);
                        }
                        
                        resultContainer.classList.add('active');
                    } else {
                        showError('No results generated');
                    }
                } else {
                    showError(data.error || 'Failed to generate image');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                loading.classList.remove('active');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }
    </script>
</body>
</html>
